name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Pin the Codocation CLI version. Bump this to upgrade.
  # Must match a tag in https://github.com/codocation/codocation/releases
  CLI_TAG: 262.11.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Codocation CLI is a Gradle application distribution; its launcher and dependency JARs must stay together
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Codocation CLI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.CLI_TAG }}
        run: |
          set -e
          mkdir -p .tools
          gh release download "$TAG" \
            -R codocation/codocation \
            -p 'codocation-cli.zip' \
            -D .tools
          unzip -q .tools/codocation-cli.zip -d .tools
          CLI_HOME=".tools/codocation-cli-$TAG"
          test -f "$CLI_HOME/lib/codocation-cli.jar"
          chmod +x "$CLI_HOME/bin/codocation"
          ls -la .tools

      - name: Generate site
        run: |
          set -e
          ".tools/codocation-cli-${CLI_TAG}/bin/codocation" build --root "$GITHUB_WORKSPACE" --out _site
          # The CLI writes this single-site build directly into _site.
          test -f _site/index.html || { echo "site not generated at _site"; exit 1; }
          ls -la _site | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
